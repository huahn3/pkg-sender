version: '3.8'

services:
  ps4-pkg-sender:
    build: .
    image: ps4-pkg-sender:local
    container_name: ps4-pkg-sender
    restart: unless-stopped
    ports:
      - "7895:7895"
    environment:
      - PORT=7895
      - STATIC_FILES=/files
      - CACHE_DIR=/cache
      - LOCALIP=192.168.31.88      # NAS/Host LAN IP that the console downloads PKGs from
      - PS4IP=192.168.31.176       # PS5/PS4 console LAN IP
      - PS4PORT=12800              # PS5 pkg-receiver / PS4 RPI port
      - INSTALL_DELAY_MS=300
    volumes:
      - /vol2/1000/R0/PS5/:/files:ro
      - ./cache:/cache
